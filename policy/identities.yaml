# Workload identities and the fact types each one is allowed to write.
#
# Rule enforced at load: every fact type has exactly ONE authoritative writer.
# Separation of duties lives here: the identity that proposes a change cannot
# write its tier, its check results or its gate result.
#
# Public keys are in identity-keys.yaml (generated by tools/gen_demo_keys.py).

identities:
  - name: agent-executor
    role: Any conforming executor that drafts a change. Proposes; proves nothing.
    may_write: [change.proposed]

  - name: ci-tiering
    role: The tier rulebook running in CI.
    may_write: [tier.assigned]

  - name: ci-gates
    role: CI re-running the paired checks and gates, independent of the executor.
    may_write: [check.result, gate.result]

  - name: skill-publisher
    role: Release identity for SME-owned skills, after review and merge.
    may_write: [skill.published]

  - name: ci-reconciler
    role: Daily completeness reconciliation.
    may_write: [reconciliation.result]
