# Roles, and the workload identities that hold them.
#
# Rules enforced when policy loads:
#   - every fact type has exactly ONE authoritative role
#   - every identity holds exactly one role
#   - every identity has its own signing key; no key is shared
#
# Separation of duties lives here. The executor role can propose a change and
# state a claim about it. It cannot write a tier, a check result, a hand-back
# verdict or a gate result. Several executors can hold the executor role, each
# under its own identity and key, which is what makes them swappable.
#
# Public keys are in identity-keys.yaml (generated by tools/gen_demo_keys.py).

roles:
  - name: executor
    description: Drafts a change. Proposes and claims; proves nothing.
    may_write: [change.proposed, executor.evidence]

  - name: tiering
    description: The tier rulebook running in CI.
    may_write: [tier.assigned]

  - name: gates
    description: CI validating hand-backs, re-running checks, recording gates.
    may_write: [handback.result, evidence.mismatch, check.result, tower.result, gate.result,
                reproduction.result]

  - name: skill-publisher
    description: Release of SME-owned skills, after review and merge.
    may_write: [skill.published]

  - name: reconciler
    description: Daily completeness reconciliation.
    may_write: [reconciliation.result]

  - name: conformance
    description: Runs the executor conformance suite and records the result.
    may_write: [conformance.result]

  - name: gateway
    description: The only route to a model. Records what was used.
    may_write: [gateway.usage]

  - name: reviewer
    description: Advisory review by a model that did not write the change. Advice only.
    may_write: [review.advice]

  - name: approver
    description: A named person approving a Tier C release. Never the person who launched the work.
    may_write: [approval.recorded, migration.approved]

  - name: release
    description: Decides a release from recorded gates and approvals, and seals the manifest.
    may_write: [release.approved, release.refused, release.manifest, degraded.backfilled]

  - name: runtime
    description: The agent runtime's orchestrator. Moves a case and records each step.
    may_write: [case.started, node.completed, case.routed, case.completed, case.halted,
                guard.tripped, case.migrated]

  - name: decision-service
    description: A deterministic decision service. The only source of a regulated figure.
    may_write: [decision.made]

  - name: runtime-agent
    description: An agent node in the runtime. Drafts; decides nothing.
    may_write: [agent.output]

  - name: case-reviewer
    description: A person who resolves a case the runtime routed to them.
    may_write: [review.resolved]

  - name: evals
    description: Runs evals against the runtime and records the result.
    may_write: [eval.result]

  - name: triage
    description: Opens a defect from what the ledger shows.
    may_write: [defect.opened]

  - name: product-owner
    description: A person who decides whether a slice goes ahead.
    may_write: [slice.decided]

identities:
  - name: agent-executor
    role: executor
    note: A generic executor identity, used when no adapter is involved.

  - name: executor-recorded
    role: executor
    note: Replays a stored patch. No model. Always labelled as recorded.

  - name: executor-loop
    role: executor
    note: A small tool loop over the model gateway. Model-agnostic.

  - name: executor-cli
    role: executor
    note: A headless coding-agent command run inside the worktree.

  - name: ci-tiering
    role: tiering

  - name: ci-gates
    role: gates

  - name: skill-publisher
    role: skill-publisher

  - name: ci-reconciler
    role: reconciler

  - name: ci-conformance
    role: conformance

  - name: model-gateway
    role: gateway

  - name: advisory-reviewer
    role: reviewer

  - name: approver-ana
    role: approver
    note: A person. Synthetic.

  - name: approver-ben
    role: approver
    note: A person. Synthetic.

  - name: approver-cy
    role: approver
    note: A person. Synthetic.

  - name: ci-release
    role: release

  - name: rt-orchestrator
    role: runtime

  - name: svc-decision-income
    role: decision-service

  - name: rt-explainer
    role: runtime-agent

  - name: case-reviewer-dee
    role: case-reviewer
    note: A person. Synthetic.

  - name: ci-evals
    role: evals

  - name: ci-triage
    role: triage

  - name: owner-pat
    role: product-owner
    note: A person. Synthetic.
