# Path map: what each part of the repository is, and so what tier a change to
# it takes. Every matching rule applies and the highest tier wins, so order does
# not matter and a broad rule cannot lower a narrow one.
#
# Anything not matched here is Tier C until someone maps it.

version: 0

paths:
  - glob: "docs/**"
    tier: A
    data_classes: [none]
    reason: documentation, no runtime effect

  - glob: "README.md"
    tier: A
    data_classes: [none]
    reason: documentation, no runtime effect

  - glob: "specs/**"
    tier: B
    reason: specs are the contract between people and agents

  - glob: "CLAUDE.md"
    tier: C
    reason: instructions every coding agent loads; it shapes every change

  - glob: ".gitattributes"
    tier: C
    reason: pins the line endings that skill content hashes depend on

  - glob: ".gitignore"
    tier: B
    reason: repository hygiene

  - glob: "services/__init__.py"
    tier: B
    reason: package marker, no logic

  - glob: "Makefile"
    tier: B
    reason: developer entry points

  - glob: "pyproject.toml"
    tier: B
    reason: build and dependency definition

  - glob: "tools/**"
    tier: B
    reason: developer tooling

  - glob: "tests/**"
    tier: B
    reason: tests are part of the control; weakening one is not routine

  - glob: "attacks/**"
    tier: B
    reason: the attack pack is part of the control

  - glob: "executors/**"
    tier: B
    data_classes: [internal]
    reason: executor adapters; no control lives in an adapter

  - glob: "conformance/**"
    tier: C
    reason: the conformance suite and its scenarios decide which executors may be used

  - glob: "heldout/**"
    tier: C
    reason: held-out cases are a gate; weakening one weakens every Tier C release

  - glob: "runtime/**"
    tier: C
    data_classes: [consumer-personal, credit-decision]
    reason: the agent runtime; it moves real cases and calls the decision service

  - glob: "runtime/synthetic/**"
    tier: B
    reason: synthetic test data; created, never masked from real data

  - glob: "harness/**"
    tier: B
    data_classes: [internal]
    reason: delivery harness code

  - glob: "harness/ledger/**"
    tier: C
    reason: the evidence layer; a defect here undermines every other control

  - glob: "harness/tiering/**"
    tier: C
    reason: the rulebook that sets tiers cannot be changed as routine work

  - glob: "harness/tower/**"
    tier: C
    reason: the confidence tower; its gates decide what merges

  - glob: "harness/release.py"
    tier: C
    reason: the release rule and the manifest

  - glob: "harness/degraded.py"
    tier: C
    reason: the path used when the pipeline is down

  - glob: "harness/delivery.py"
    tier: C
    reason: the order of control around an executor

  - glob: "harness/workorder.py"
    tier: C
    reason: hand-back validation

  - glob: "harness/gateway.py"
    tier: C
    reason: model pins, roles and budget

  - glob: "harness/tools.py"
    tier: C
    reason: the deny list, enforced before an action

  - glob: "harness/check*.py"
    tier: C
    reason: the check runner; what it trusts decides what a check proves

  - glob: "harness/gates.py"
    tier: C
    reason: the gate that blocks merges

  - glob: "policy/**"
    tier: C
    reason: governance plane; tier rules, identities, records schedule

  - glob: ".github/workflows/**"
    tier: C
    reason: the pipeline is the control; changing it changes every gate

  - glob: "demo-keys/**"
    tier: C
    reason: signing keys

  - glob: "knowledge/blueprint/**"
    tier: B
    reason: service blueprint

  - glob: "knowledge/slices/**"
    tier: B
    reason: discovery slices; the go or kill decision and its outcome metric

  - glob: "knowledge/cards/**"
    tier: C
    data_classes: [credit-decision]
    reason: cards state rules that drive a credit decision

  - glob: "knowledge/decisions/**"
    tier: C
    reason: the decision and obligation register

  - glob: "knowledge/skills/**"
    tier: B
    reason: skills; the skill map can raise this by consuming node

  - glob: "services/decision_income/**"
    tier: C
    data_classes: [credit-decision, consumer-personal]
    reason: deterministic decision service for a regulated moment
